name: Cougr Studio testnet smoke

on:
  pull_request:
    paths:
      - "studio/**"
      - ".github/workflows/cougr-studio-testnet.yml"
  workflow_dispatch:

jobs:
  testnet-smoke:
    if: ${{ vars.COUGR_TESTNET_SMOKE == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      - run: npm run test -- --runInBand studio/tests/play-loop.spec.ts
        working-directory: studio
        env:
          USE_REAL_SERVICES: true
